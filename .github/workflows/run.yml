name: OCI Capacity Poller

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  try-create-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-interaction

      - name: Create .env
        run: |
          cat > .env <<EOF
          OCI_REGION=${{ secrets.OCI_REGION }}
          OCI_USER_ID=${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT=${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME=./private.pem
          OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID=${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS=4
          OCI_MEMORY_IN_GBS=24
          OCI_SHAPE=VM.Standard.A1.Flex
          OCI_MAX_INSTANCES=1
          OCI_SSH_PUBLIC_KEY="${{ secrets.OCI_SSH_PUBLIC_KEY }}"
          OCI_AVAILABILITY_DOMAIN=
          CACHE_AVAILABILITY_DOMAINS=1
          EOF

      - name: Write private key
        run: echo "${{ secrets.OCI_PRIVATE_KEY }}" > ./private.pem

      - name: Run retry loop
        run: |
          ATTEMPT=0
          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "[$(date '+%H:%M:%S')] Attempt $ATTEMPT"
            OUTPUT=$(php index.php 2>&1)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q '"lifecycleState"'; then
              echo "SUCCESS - instance created!"
              exit 0
            fi
            sleep 60
          done

      - name: Re-trigger workflow
        if: always()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Next run triggered."
