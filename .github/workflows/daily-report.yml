name: Daily Status Report

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-interaction

      - name: Create .env
        run: |
          cat > .env <<EOF
          OCI_REGION=${{ secrets.OCI_REGION }}
          OCI_USER_ID=${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT=${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME=./private.pem
          OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID=${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS=4
          OCI_MEMORY_IN_GBS=24
          OCI_SHAPE=VM.Standard.A1.Flex
          OCI_MAX_INSTANCES=1
          OCI_AVAILABILITY_DOMAIN=
          CACHE_AVAILABILITY_DOMAINS=0
          EOF

      - name: Write private key
        run: echo "${{ secrets.OCI_PRIVATE_KEY }}" > ./private.pem

      - name: Check OCI status
        id: status
        run: |
          RESULT=$(php check_status.php 2>&1)
          echo "result=$RESULT" >> $GITHUB_OUTPUT
          STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Send email
        run: |
          RESULT='${{ steps.status.outputs.result }}'
          STATUS='${{ steps.status.outputs.status }}'
          DATE=$(date '+%Y-%m-%d')

          if [ "$STATUS" = "SUCCESS" ]; then
            NAME=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('name','?'))")
            STATE=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('state','?'))")
            SUBJECT="✅ OCI ARM — instancja działa ($DATE)"
            BODY="Instancja Oracle ARM jest aktywna.\n\nNazwa: $NAME\nStan: $STATE\nRegion: eu-paris-1"
          elif [ "$STATUS" = "WAITING" ]; then
            SUBJECT="⏳ OCI ARM — brak capacity ($DATE)"
            BODY="Instancja Oracle ARM jeszcze nie została utworzona.\n\nPoller działa — próbuje co 5 minut.\nRegion: eu-paris-1 (VM.Standard.A1.Flex, 4 OCPU, 24 GB RAM)"
          else
            SUBJECT="❌ OCI ARM — błąd sprawdzania statusu ($DATE)"
            BODY="Nie udało się sprawdzić statusu instancji.\n\nSzczegóły: $RESULT"
          fi

          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"OCI Poller <onboarding@resend.dev>\",
              \"to\": [\"herrradek@gmail.com\"],
              \"subject\": \"$SUBJECT\",
              \"text\": \"$BODY\"
            }"
